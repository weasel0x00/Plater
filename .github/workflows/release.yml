name: Release

# Build the maintained `plater` CLI for macOS (Apple Silicon) and
# Windows (x64), then attach the binaries to the GitHub release for the
# pushed tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            asset: plater-macos-arm64
            binary: build/plater
          - os: windows-latest
            name: windows-x64
            asset: plater-windows-x64.exe
            binary: build/Release/plater.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S plater -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S plater -B build -A x64

      - name: Build
        run: cmake --build build --config Release -j

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
